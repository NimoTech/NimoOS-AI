name: nimoos-agent

# NimoOS Agent — offline image deployment (the image is injected via docker load from
# the tar built by script/package-agent.sh, pull_policy: never). AppManagement
# recognizes it as a system app via labels.
services:
  agent:
    image: localhost/nimoos-agent:bundled
    pull_policy: never
    network_mode: host          # binds 127.0.0.1:8282, unchanged for the nimoos-ai reverse proxy
    # netns egress isolation caps. SYS_ADMIN is REQUIRED: the executor's
    # unshare(CLONE_NEWNET) that creates the per-command network namespace needs
    # CAP_SYS_ADMIN — spike-verified 2026-07-16 (cap-drop=ALL → unshare EPERM;
    # cap-add=SYS_ADMIN → OK). NET_ADMIN configures the veth/interfaces inside it.
    # Do NOT drop SYS_ADMIN — it would break the netns P0 boundary.
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    # Belt-and-suspenders: forbid gaining ANY further privilege beyond the caps
    # above (setuid binaries, file capabilities). Does not affect the granted caps.
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 1024
    cpus: "2.0"
    # The executor's pid/socket and the MCP per-server socket must live on a [writable]
    # mount; /var/run/nimoos is a read-only service-discovery directory (the executor
    # writing to it would get EROFS), so point them at the rw ai/agent volume instead.
    environment:
      NIMOOS_EXEC_SOCK: /var/lib/nimoos/ai/agent/agent-exec.sock
      NIMOOS_EXEC_PID_FILE: /var/lib/nimoos/ai/agent/agent-exec.pid
      NIMOOS_MCP_SOCK_DIR: /var/lib/nimoos/ai/agent
      # Phoenix (OTLP) tracing endpoint/project. Enabling is a runtime setting
      # (AI Settings "Agent monitoring" toggle → user_settings): instrumentation
      # installs at startup and exports only while enabled; net=host makes
      # 127.0.0.1:6006 reachable. Do NOT set NIMOOS_AGENT_TRACING here — the value
      # "0" hard-disables instrumentation (escape hatch only), which would make
      # the toggle a no-op.
      PHOENIX_OTLP_ENDPOINT: "${PHOENIX_OTLP_ENDPOINT:-http://127.0.0.1:6006/v1/traces}"
      PHOENIX_PROJECT: "${PHOENIX_PROJECT:-nimoos-agent}"
    volumes:
      # rslave: lets the container see new host mounts made after the container starts
      # (USB→/media, array→/DATA); one-directional, nothing leaks back.
      - { type: bind, source: /DATA,  target: /DATA,  bind: { propagation: rslave } }
      - { type: bind, source: /media, target: /media, bind: { propagation: rslave } }
      - { type: bind, source: /mnt,   target: /mnt,   bind: { propagation: rslave } }
      - { type: bind, source: /var/run/nimoos, target: /var/run/nimoos, read_only: true }
      - { type: bind, source: /var/lib/nimoos/ai/agent, target: /var/lib/nimoos/ai/agent }
      # skills root: Go (host) seeds builtin/ here and builds the .runtime/<user>/ symlink
      # view; the container's Python list_skills/read_skill_file only scans read-only, hence read_only.
      - { type: bind, source: /var/lib/nimoos/ai/skills, target: /var/lib/nimoos/ai/skills, read_only: true }
      # NOTE: /etc/nimoos is no longer mounted (P2c). Agent config goes entirely through
      # NIMOOS_* env vars and never reads /etc/nimoos; this mount used to expose
      # ai_master.key/service config to root commands. Mount masking is hard-blocked by
      # the docker-default AppArmor profile (§14.5), so removing the mount directly
      # eliminates the exposure. The host's real /etc/nimoos and other services are unaffected.
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
    labels:
      nimoos.system: "true"
      nimoos.display_name: "NimoOS Agent"
